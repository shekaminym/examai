name: Windows beta build
on:
  workflow_dispatch:
  pull_request:
    paths: ['examai/**', 'release/**', 'requirements*.txt', 'tests/**']
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-rag.txt -r server/requirements.txt pytest pyinstaller==6.22.3
      - run: python -m pytest -q
      - run: choco install innosetup --yes
      - run: ./release/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: EXAM-AI-Setup
          path: release-build/EXAM-AI-Setup.exe
