<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EXAM AI · Administration</title>
  <link rel="stylesheet" href="/admin/panel.css">
  <script defer src="/admin/panel.js"></script>
</head>
<body>
  <main id="login" class="login">
    <div class="brand"><span aria-hidden="true">ϟ</span> EXAM AI</div>
    <h1>Beta administration</h1>
    <p>Sign in with an authorized Google account.</p>
    <button class="primary" id="sign-in">Continue with Google</button>
    <p id="login-status" role="status"></p>
  </main>
  <div id="app" class="app" hidden>
    <aside>
      <div class="brand"><span aria-hidden="true">ϟ</span> EXAM AI</div>
      <nav aria-label="Administration">
        <button data-view="dashboard">Dashboard</button><button data-view="users">Users</button>
        <button data-view="invitations">Invitations</button><button data-view="licenses">Licenses</button>
        <button data-view="reports">Bug Reports</button><button data-view="staff">Administrators</button>
        <button data-view="activity">Activity Log</button>
      </nav>
      <button id="sign-out">Sign out</button>
    </aside>
    <main class="workspace">
      <header><h1 id="heading"></h1><span class="role" id="actor"></span></header>
      <div id="notice" role="status" aria-live="polite" hidden></div>
      <section data-page="dashboard"><div id="summary" class="metrics"></div></section>
      <section data-page="users" hidden>
        <form id="search-form" class="toolbar">
          <label>Search by email<input type="search" name="search" placeholder="Google email" maxlength="254"></label>
          <button>Search</button>
        </form>
        <div id="users"></div>
      </section>
      <section data-page="invitations" hidden>
        <form id="invite-form" class="toolbar">
          <label>Google email<input type="email" name="email" maxlength="254" required></label>
          <label>Access<select name="kind">
            <option value="30">30 minutes</option><option value="60">60 minutes</option>
            <option value="custom">Custom minutes</option><option value="7d">7 days</option>
            <option value="30d">30 days</option><option value="unlimited">Unlimited</option>
          </select></label>
          <label id="custom-amount" hidden>Minutes<input type="number" name="minutes" min="1" max="10080" value="30"></label>
          <label>Code expires in (days)<input type="number" name="validity" min="1" max="30" value="7" required></label>
          <button class="primary">Create Invite</button>
        </form>
        <div id="invitations"></div>
      </section>
      <section data-page="licenses" hidden>
        <form id="license-form" class="toolbar">
          <label>Google email<input type="email" name="email" maxlength="254" required></label>
          <label>Action<select name="action">
            <option value="minutes">Add Minutes</option><option value="remove">Remove Minutes</option>
            <option value="days">Extend Access</option><option value="suspend">Suspend</option>
            <option value="restore">Unsuspend</option><option value="revoke">Revoke License</option>
          </select></label>
          <label id="license-amount"><span id="amount-label">Minutes</span>
            <input type="number" name="amount" min="1" max="10080" value="30" required>
          </label>
          <button class="primary">Review Change</button>
        </form>
        <div id="licenses"></div>
      </section>
      <section data-page="reports" hidden>
        <form id="reports-form" class="toolbar">
          <label>Status<select name="status"><option value="">All statuses</option></select></label>
          <label>Reporter email<input type="email" name="email" maxlength="254" placeholder="All users"></label>
          <button>Filter</button>
        </form>
        <div id="reports"></div>
      </section>
      <section data-page="staff" hidden>
        <form id="staff-form" class="toolbar" hidden>
          <label>Google email<input type="email" name="email" maxlength="254" required></label>
          <button class="primary">Add Administrator</button>
        </form>
        <div id="staff"></div>
      </section>
      <section data-page="activity" hidden><div id="activity"></div></section>
    </main>
  </div>
  <dialog id="dialog"><form id="dialog-form">
    <h2 id="dialog-title"></h2><div id="dialog-content"></div>
    <footer><button type="button" id="dialog-close">Cancel</button><button class="primary" id="dialog-submit">Confirm</button></footer>
  </form></dialog>
</body>
</html>
