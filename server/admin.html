<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EXAM AI · Адміністрування</title>
  <link rel="stylesheet" href="/admin/panel.css">
  <script defer src="/admin/panel.js"></script>
</head>
<body>
  <main id="login" class="login">
    <div class="brand"><span aria-hidden="true">ϟ</span> EXAM AI</div>
    <h1>Керування бета-тестуванням</h1>
    <p>Увійдіть до облікового запису Google з правами адміністратора.</p>
    <button class="primary" id="sign-in">Увійти через Google</button>
    <p id="login-status" role="status"></p>
  </main>
  <div id="app" class="app" hidden>
    <aside>
      <div class="brand"><span aria-hidden="true">ϟ</span> EXAM AI</div>
      <nav aria-label="Адміністрування">
        <button data-view="dashboard">Огляд</button><button data-view="users">Користувачі</button>
        <button data-view="invitations">Запрошення</button><button data-view="licenses">Ліцензії</button>
        <button data-view="reports">Звіти про помилки</button><button data-view="staff">Адміністратори</button>
        <button data-view="activity">Журнал дій</button>
      </nav>
      <button id="sign-out">Вийти</button>
    </aside>
    <main class="workspace">
      <header><h1 id="heading"></h1><span class="role" id="actor"></span></header>
      <div id="notice" role="status" aria-live="polite" hidden></div>
      <section data-page="dashboard"><div id="summary" class="metrics"></div></section>
      <section data-page="users" hidden>
        <form id="search-form" class="toolbar">
          <label>Пошук за електронною поштою<input type="search" name="search" placeholder="Електронна пошта Google" maxlength="254"></label>
          <button>Знайти</button>
        </form>
        <div id="users"></div>
      </section>
      <section data-page="invitations" hidden>
        <form id="invite-form" class="toolbar">
          <label>Електронна пошта Google<input type="email" name="email" maxlength="254" required></label>
          <label>Доступ<select name="kind">
            <option value="30">30 хвилин</option><option value="60">60 хвилин</option>
            <option value="custom">Інша кількість хвилин</option><option value="7d">7 днів</option>
            <option value="30d">30 днів</option><option value="unlimited">Без обмежень</option>
          </select></label>
          <label id="custom-amount" hidden>Хвилини<input type="number" name="minutes" min="1" max="10080" value="30"></label>
          <label>Строк дії коду (дні)<input type="number" name="validity" min="1" max="30" value="7" required></label>
          <button class="primary">Створити запрошення</button>
        </form>
        <div id="invitations"></div>
      </section>
      <section data-page="licenses" hidden>
        <form id="license-form" class="toolbar">
          <label>Електронна пошта Google<input type="email" name="email" maxlength="254" required></label>
          <label>Дія<select name="action">
            <option value="minutes">Додати хвилини</option><option value="remove">Списати хвилини</option>
            <option value="days">Продовжити доступ</option><option value="suspend">Призупинити доступ</option>
            <option value="restore">Відновити доступ</option><option value="revoke">Відкликати ліцензію</option>
          </select></label>
          <label id="license-amount"><span id="amount-label">Хвилини</span>
            <input type="number" name="amount" min="1" max="10080" value="30" required>
          </label>
          <button class="primary">Перевірити зміну</button>
        </form>
        <div id="licenses"></div>
      </section>
      <section data-page="reports" hidden>
        <form id="reports-form" class="toolbar">
          <label>Статус<select name="status"><option value="">Усі статуси</option></select></label>
          <label>Електронна пошта автора<input type="email" name="email" maxlength="254" placeholder="Усі користувачі"></label>
          <button>Застосувати фільтр</button>
        </form>
        <div id="reports"></div>
      </section>
      <section data-page="staff" hidden>
        <form id="staff-form" class="toolbar" hidden>
          <label>Електронна пошта Google<input type="email" name="email" maxlength="254" required></label>
          <button class="primary">Додати адміністратора</button>
        </form>
        <div id="staff"></div>
      </section>
      <section data-page="activity" hidden><div id="activity"></div></section>
    </main>
  </div>
  <dialog id="dialog"><form id="dialog-form">
    <h2 id="dialog-title"></h2><div id="dialog-content"></div>
    <footer><button type="button" id="dialog-close">Скасувати</button><button class="primary" id="dialog-submit">Підтвердити</button></footer>
  </form></dialog>
</body>
</html>
